<script>
(function(){
  var ITER = 600000, S = "board-passphrase", DOCS = null, CURRENT = "clients";
  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(pass, salt){
    var raw = new TextEncoder().encode(pass);
    var base = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function decrypt(pass){
    var all = b64ToBytes(document.getElementById("payload").textContent.trim());
    var salt = all.slice(0,16), iv = all.slice(16,28), tag = all.slice(28,44), ct = all.slice(44);
    var body = new Uint8Array(ct.length + tag.length);
    body.set(ct,0); body.set(tag, ct.length);
    var key = await deriveKey(pass, salt);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, body);
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function paint(){
    var html = DOCS[CURRENT] || DOCS.clients || "";
    var frame = document.createElement("iframe");
    frame.setAttribute("sandbox","allow-scripts allow-same-origin");
    frame.referrerPolicy = "no-referrer";
    frame.srcdoc = html;
    var host = document.getElementById("board");
    host.innerHTML = ""; host.appendChild(frame); host.style.display = "block";
    var tabs = document.getElementById("tabs");
    tabs.hidden = false; tabs.style.display = "flex";
    Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-tab") === CURRENT);
    });
    document.getElementById("gate").style.display = "none";
  }
  function show(docs){
    DOCS = docs;
    if (!DOCS[CURRENT]) CURRENT = Object.keys(DOCS)[0];
    paint();
  }
  var tabs = document.getElementById("tabs");
  if (tabs) Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){
      CURRENT = b.getAttribute("data-tab");
      if (DOCS) paint();
    });
  });
  document.getElementById("gate").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var btn = document.getElementById("go"), err = document.getElementById("err");
    var pass = document.getElementById("pw").value;
    if (!pass) return;
    btn.disabled = true; err.textContent = "";
    try {
      var docs = await decrypt(pass);
      try { sessionStorage.setItem(S, pass); } catch(e){}
      show(docs);
    } catch (e) {
      err.textContent = "That passphrase did not decrypt this page.";
      btn.disabled = false;
    }
  });
  try {
    var cached = sessionStorage.getItem(S);
    if (cached) decrypt(cached).then(show).catch(function(){ sessionStorage.removeItem(S); });
  } catch (e) {}
})();
</script>
