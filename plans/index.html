<script>
const blob = JSON.parse(document.getElementById('blob').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(blob.salt), iterations:blob.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  return new TextDecoder().decode(plain);
}
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pass = document.getElementById('pw').value;
  if(!pass) return;
  btn.disabled = true; err.textContent = '';
  try{
    const html = await unlock(pass);
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent = 'That passphrase did not work.';
    btn.disabled = false;
  }
});
</script>
</body></html>
